<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075A2A"/>
      <stop offset="50%" stop-color="#12351F"/>
      <stop offset="100%" stop-color="#178B36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8BC63E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#075A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow)"/>
  
  <!-- Silhouette / Avatar Graphic -->
  <g transform="translate(200, 190)" fill="#FFFFFF" opacity="0.9">
    <!-- Graduation Cap Icon -->
    <path d="M-60,-80 L0,-110 L60,-80 L0,-50 Z" fill="#8BC63E"/>
    <path d="M40,-70 L40,-35 L45,-30 L50,-35 L50,-70" stroke="#8BC63E" stroke-width="3" fill="none"/>
    <path d="M-40,-65 L0,-45 L40,-65 L40,-35 C40,-15 -40,-15 -40,-35 Z" fill="#8BC63E" opacity="0.7"/>

    <!-- Head -->
    <circle cx="0" cy="-10" r="45" fill="#FFFFFF"/>
    <!-- Shoulders -->
    <path d="M-75,90 C-75,40 -40,30 0,30 C40,30 75,40 75,90 Z" fill="#FFFFFF"/>
  </g>

  <!-- Name & Title Tag -->
  <rect x="30" y="380" width="340" height="90" rx="16" fill="#000000" fill-opacity="0.4"/>
  <text x="200" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    DR. AKHIL BHARDWAJ
  </text>
  <text x="200" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8BC63E" text-anchor="middle" letter-spacing="1">
    ASST. PROFESSOR • RAJASTHAN
  </text>
</svg>
